name: Custom Build Verification

on:
  pull_request:
    branches:
      - custom/model-warmth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 for Node tests
        run: npm rebuild better-sqlite3
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
      - run: npm run build:renderer

  macos-package:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore native-resource cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: resources/bin
          key: custom-macos-arm64-${{ hashFiles('scripts/download-*.js', 'scripts/build-*.js', 'resources/*.swift') }}
      - name: Prepare native resources
        run: npm run prebuild:mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build custom macOS package
        run: npm run build:custom:mac:arm64
      - name: Verify custom identity and signature
        run: |
          set -euo pipefail
          app="dist-custom/mac-arm64/OpenWhispr Custom.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.james.openwhispr.custom"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = "openwhispr-custom"
          codesign --verify --deep --strict "$app"
      - name: Smoke-test packaged native modules in Electron
        run: npm run verify:custom:mac:arm64
      - name: Upload candidate package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: OpenWhispr-Custom-macOS-arm64
          path: |
            dist-custom/*.dmg
            dist-custom/*.zip
          if-no-files-found: error
          retention-days: 30
