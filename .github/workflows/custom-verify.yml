name: Custom Build Verification

on:
  pull_request:
    branches:
      - custom/model-warmth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build better-sqlite3 for Node tests
        run: npm rebuild better-sqlite3
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
      - run: npm run build:renderer

  macos-package:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore native-resource cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: resources/bin
          key: custom-macos-arm64-${{ hashFiles('scripts/download-*.js', 'scripts/build-*.js', 'resources/*.swift') }}
      - name: Prepare native resources
        run: npm run prebuild:mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build custom macOS package
        run: npm run build:custom:mac:arm64
      - name: Verify custom identity and signature
        run: |
          set -euo pipefail
          app="dist-custom/mac-arm64/OpenWhispr Custom.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.james.openwhispr.custom"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = "openwhispr-custom"
          codesign --verify --deep --strict "$app"
      - name: Upload candidate package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: OpenWhispr-Custom-macOS-arm64
          path: |
            dist-custom/*.dmg
            dist-custom/*.zip
          if-no-files-found: error
          retention-days: 30
