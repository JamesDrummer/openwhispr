name: Custom Upstream Watch

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional stable OpenWhispr release tag"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: custom-upstream-watch
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: OpenWhispr/openwhispr

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the custom branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Discover the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          state_json="$(node scripts/custom-maintenance.js status)"
          current_base="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(s.currentBaseSha)' "$state_json")"
          last_tag="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(s.lastObservedStableRelease.tag)' "$state_json")"
          last_sha="$(node -e 'const s=JSON.parse(process.argv[1]); process.stdout.write(s.lastObservedStableRelease.commitSha)' "$state_json")"

          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi
          node -e 'require("./scripts/lib/custom-maintenance").validateReleaseTag(process.argv[1])' "$tag"

          git fetch --force --no-tags "https://github.com/$UPSTREAM_REPOSITORY.git" \
            "+refs/tags/$tag:refs/tags/$tag"
          target_sha="$(git rev-list -n 1 "$tag^{commit}")"
          node -e 'require("./scripts/lib/custom-maintenance").validateSha(process.argv[1])' "$target_sha"

          if [[ "$tag" == "$last_tag" ]]; then
            if [[ "$target_sha" != "$last_sha" ]]; then
              echo "Release tag $tag moved from $last_sha to $target_sha; refusing to trust a mutable tag." >&2
              exit 1
            fi
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$current_base" "$target_sha"; then
            title="[custom update] $tag is not a descendant of the trusted base"
            existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --title "$title" \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "Automation refused to integrate \`$tag\` (\`$target_sha\`) because it is not a descendant of the trusted base \`$current_base\`. This prevents downgrade or history-replay updates and needs manual review."
            fi
            exit 1
          fi

          safe_tag="${tag//[^0-9A-Za-z._-]/-}"
          {
            echo "needs_update=true"
            echo "tag=$tag"
            echo "target_sha=$target_sha"
            echo "current_base=$current_base"
            echo "branch=automation/openwhispr-$safe_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Integrate the stable release
        if: steps.release.outputs.needs_update == 'true'
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          CURRENT_BASE: ${{ steps.release.outputs.current_base }}
          BRANCH: ${{ steps.release.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "An integration branch for $TAG already exists; leaving it for its existing PR."
            exit 0
          fi

          git config user.name "OpenWhispr Custom Automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git diff --name-only "$CURRENT_BASE" "$TARGET_SHA" > "$RUNNER_TEMP/upstream-changes.txt"

          if ! git merge --no-commit --no-ff "$TARGET_SHA"; then
            conflicts="$(git diff --name-only --diff-filter=U | sed -n '1,30p')"
            git merge --abort
            title="[custom update] $TAG needs conflict repair"
            existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
            if [[ -z "$existing" ]]; then
              issue_body="$(printf '%s\n' \
                "The stable OpenWhispr release \`$TAG\` could not be merged automatically. Conflicting files:" \
                "" \
                "\`\`\`" \
                "$conflicts" \
                "\`\`\`" \
                "" \
                "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
              gh issue create \
                --title "$title" \
                --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "$issue_body"
            fi
            exit 1
          fi

          report="$(node scripts/custom-maintenance.js record \
            --tag "$TAG" \
            --sha "$TARGET_SHA" \
            --files "$RUNNER_TEMP/upstream-changes.txt")"
          risk="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.risk)' "$report")"
          watched="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.watchedChanges.join(\"\\n\") || \"None\")' "$report")"

          git add custom/upstream-state.json custom/integration-report.json electron-builder.custom.json
          git commit -m "Merge OpenWhispr $TAG into custom build"
          git push --set-upstream origin "$BRANCH"

          body_file="$RUNNER_TEMP/pull-request.md"
          {
            echo "## Automated stable-release integration"
            echo
            echo "- Upstream release: \`$TAG\`"
            echo "- Immutable commit: \`$TARGET_SHA\`"
            echo "- Risk classification: **$risk**"
            echo
            echo "### Watched upstream changes"
            echo
            echo '```text'
            echo "$watched"
            echo '```'
            echo
            echo "Custom Build Verification will run the full tests and create an ad-hoc-signed macOS package. Low-risk PRs are eligible for automatic merging only after that workflow succeeds. Review-classified PRs remain approval-gated."
          } > "$body_file"

          if [[ "$risk" == "low" ]]; then
            pr_url="$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "Integrate OpenWhispr $TAG" --body-file "$body_file")"
          else
            pr_url="$(gh pr create --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "Review OpenWhispr $TAG integration" --body-file "$body_file")"
          fi
          gh pr edit "$pr_url" --add-assignee "$GITHUB_REPOSITORY_OWNER"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

      - name: No new release
        if: steps.release.outputs.needs_update == 'false'
        run: echo "The latest stable OpenWhispr release is already represented."
